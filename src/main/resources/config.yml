# 🌍 Language Settings
#
# This defines the default language for the plugin.
# 
# 🔹 How it works:
# - The plugin will use the language file that matches this setting.
# - Language files are stored in the "lang" folder inside the plugin directory.
# - If the specified language file is missing, the plugin will default to English (en_US).
#
# 🔹 Available Languages (no download needed):
# - "en_US" → English (default)
# - "de_DE" → German
#
# You can add more languages by placing additional translation files in the "lang" folder.
#
# Default: English (en_US)
language: en_US

# ⚒️ Tool Durability Settings
#
# 🔹 What this does:
# - If enabled (true), your tool loses durability for **every block** it breaks.
# - If disabled (false), your tool only loses durability **once per use**, no matter how many blocks are broken.
#
# 🔹 Example:
# - If you break 9 blocks at once:
#   - **true** → The tool takes *9 durability damage**.
#   - **false** → The tool takes **only 1 durability damage**.
#
# 🔹 Recommended:
# - Set to **false** for longer-lasting tools.
# - Set to **true** for a more balanced gameplay experience.
#
# Default: true
useDurabilityPerBlock: true

# Configure how many blocks your tool breaks at once.
#
# 🔹 Radius: The width of the mining area
# - Radius 1: Only breaks the block you mine.
# - Radius 2: Breaks the block you mine + the blocks directly next to it.
# - Radius 3: Includes another layer of surrounding blocks, and so on.
#
# 🔹 Depth: How deep the mining goes
# - Depth 1: Only breaks the surface layer (the block you hit).
# - Depth 2: Breaks the surface layer + the blocks directly underneath.
#
# Example: 
# If Radius = 3 and Depth = 2, your tool will break blocks in a wider area and also mine two layers deep.
#
# Default values: (Radius: 2, Depth: 1)
Radius: 2
Depth: 1

# 📏 Sizes per Tool (optional)
#
# 🔹 What this does:
# - Overrides Radius and Depth for single PowerTools. Tools not listed here use the values above.
# - The plow only uses Radius.
#
# 🔹 Example:
# toolSizes:
#   NETHERITE_HAMMER:
#     Radius: 3
#     Depth: 1
#   WOODEN_EXCAVATOR:
#     Radius: 1
#
# Default: no overrides
toolSizes: {}

# ⛏️ Mining Mode
#
# 🔹 What this does:
# - false → Every extra block is broken as if the player mined it by hand.
#   Protection plugins (Lands, WorldGuard, GriefPrevention, ...), CoreProtect and Jobs
#   see each block, and drops, XP and tool damage follow the vanilla rules.
#   The plow also asks the protection plugins before it tills an extra block.
# - true → The old way: blocks are removed directly. Only WorldGuard is checked,
#   XP comes from the "xp-drops" list below.
#
# 🔹 Recommended: false. Use true only if another plugin misbehaves with the new mode.
#
# Default: false
legacyMining: false

# 📋 Block Lists
#
# 🔹 What this does:
# - false → Hammers break every block a pickaxe is meant for, excavators every block a
#   shovel is meant for, using the block tags of the running Minecraft version. New blocks
#   work without a config change, and the tool tier is checked like in vanilla.
#   Blocks with an inventory or other stored data (chests, furnaces, spawners, ...) are skipped.
# - true → Only the blocks listed under "Minable" and "Diggable" below can be broken.
#
# Default: false
customBlockList: false

# 🌍 Disabled Worlds
#
# 🔹 What this does:
# - In these worlds PowerTools work like their vanilla tools (no area, no harvest).
# - Use the folder names of the worlds, for example "world_nether".
#
# Default: none
disabledWorlds: []

# 📖 Recipe Book
#
# 🔹 What this does:
# - true → Players get the PowerTool recipes they are allowed to craft in their recipe book when they join.
#
# Default: true
unlockRecipes: true

# 🎒 Auto Pickup
#
# 🔹 What this does:
# - true → Drops of blocks broken with a PowerTool go straight into the inventory.
#   Whatever does not fit stays on the ground. Works for every block with legacyMining: false,
#   with legacyMining: true only for the block you hit.
#
# Default: false
autoPickup: false

# 🐢 Mining Speed
#
# 🔹 What this does:
# - Multiplies how fast a PowerTool breaks the block you hit, compared to its vanilla tool.
# - 1.0 → as fast as the vanilla tool, 0.5 → half as fast, 2.0 → twice as fast.
# - Only applies to PowerTools crafted after the change.
#
# Default: 1.0
miningSpeed: 1.0

# 🔨 Netherite Upgrade
#
# 🔹 What this does:
# - true → A diamond PowerTool can be upgraded at the smithing table, like vanilla tools:
#   Netherite Upgrade template + diamond PowerTool + netherite ingot. Enchantments stay.
# - false → The smithing table refuses PowerTools. The crafting recipes below still work.
#
# Default: true
netheriteSmithing: true

# 🎨 Custom Item Models
#
# 🔹 What this does:
# - true → Every PowerTool points to its own item model, for example "jodellepowermining:diamond_hammer",
#   so a resource pack can give it its own texture.
# - Only turn this on together with a resource pack that contains these models, otherwise
#   the tools show the missing texture. Applies to PowerTools crafted after the change.
#
# Default: false
customItemModels: false

# 🧩 Install Textures
#
# 🔹 What this does:
# - true → The plugin hands its 64x64 textures to the installed resource pack plugin on every start:
#   - ItemsAdder: copied into plugins/ItemsAdder/contents/jodellepowermining/resourcepack.
#     Run /iazip once after the first start or an update.
#   - ResourcePackManager: written to plugins/JodellePowerMining/resourcepack and registered
#     through its API, ResourcePackManager merges and hosts it.
#   Then set customItemModels: true.
# - Files in these folders that differ from the bundled ones are overwritten. Set this to false
#   if you change the textures there yourself or use the 16x16 pack instead.
#
# Default: true
installTextures: true

# ⛏️ Minable Blocks Configuration
#
# 🔹 What this does:
# - Defines which blocks can be mined using a hammer.
# - Specifies the minimum required pickaxe type for each block.
# - Based on Minecraft's official mining mechanics.
#
# 🔹 How to use:
# - Each block name (e.g., COBBLESTONE) must match its exact name in Minecraft.
# - Below each block, specify the required pickaxe type.
#   - Use "any" if the block can be mined with any pickaxe.
#   - Use specific pickaxes (e.g., "IRON_PICKAXE") to require a minimum tool quality.
#
# 🔹 Example:
# - `COBBLESTONE: any` → Can be mined with any pickaxe.
# - `CHISELED_COPPER: STONE_PICKAXE, IRON_PICKAXE, etc.` → Requires at least a stone pickaxe.
#
# 🔹 Helpful Resources:
# - Full Material List: 🔗 [Spigot API - Material List](https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html)
# - Default Minable Blocks List of the plugin: 🔗 [GitHub](https://github.com/Holt31/JodellePowerMining)
#
# 🛠️ Customize as needed!
